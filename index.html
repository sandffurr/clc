        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                if (type === 'tick') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'timeout') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'buzz') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                    osc.frequency.setValueAtTime(110, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'correct') {
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const o = ctx.createOscillator(); const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.08));
                        g.gain.setValueAtTime(0.2, ctx.currentTime + (idx * 0.08));
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (idx * 0.08) + 0.18);
                        o.start(ctx.currentTime + (idx * 0.08)); o.stop(ctx.currentTime + (idx * 0.08) + 0.18);
                    });
                } else if (type === 'go') {
                    [523.25, 1046.50].forEach((freq, idx) => {
                        const o = ctx.createOscillator(); const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.type = 'sine'; o.frequency.setValueAtTime(freq, ctx.currentTime + (idx * 0.06));
                        g.gain.setValueAtTime(0.35, ctx.currentTime + (idx * 0.06));
                        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (idx * 0.06) + 0.15);
                        o.start(ctx.currentTime + (idx * 0.06)); o.stop(ctx.currentTime + (idx * 0.06) + 0.15);
                    });
                }
            } catch(e) {}
        }

        // --- ENHANCED SIRI / TTS SPEECH SYNTHESIS ---
        function speakThaiLine(text, onEndCallback) {
            if (isMuted || !('speechSynthesis' in window)) {
                if (onEndCallback) onEndCallback();
                return;
            }

            if (!audioUnlocked) unlockAudioEngine();

            window.speechSynthesis.cancel();

            setTimeout(() => {
                window.currentUtterance = new SpeechSynthesisUtterance(text);
                window.currentUtterance.lang = 'th-TH';
                window.currentUtterance.rate = 0.95;
                window.currentUtterance.pitch = 1.0;
                window.currentUtterance.volume = 1.0;

                if (!thaiVoice) populateVoices();
                if (thaiVoice) {
                    window.currentUtterance.voice = thaiVoice;
                }

                let hasEnded = false;
                const safeOnEnd = () => {
                    if (!hasEnded) {
                        hasEnded = true;
                        if (onEndCallback) onEndCallback();
                    }
                };

                window.currentUtterance.onend = safeOnEnd;
                window.currentUtterance.onerror = (err) => {
                    console.warn("Speech synthesis warning:", err);
                    safeOnEnd();
                };

                // Safety timeout for mobile browsers where onend may fail to trigger
                const estimatedMs = Math.max(2000, text.length * 350);
                setTimeout(() => {
                    if (!hasEnded) {
                        safeOnEnd();
                    }
                }, estimatedMs);

                window.speechSynthesis.speak(window.currentUtterance);
            }, 60);
        }

        function stopSpeaking() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        // Timer Logic
        function startCountdown(duration, triggerMode) {
            stopTimer();
            let timeLeft = duration;
            currentBuzzTriggerMode = triggerMode || 'during';

            const timerBox = document.getElementById('display-timer-box');
            const timerVal = document.getElementById('display-timer-val');
            const timerLabel = document.getElementById('display-timer-label');

            if (timerBox) {
                timerBox.classList.remove('hidden');
                timerBox.classList.add('flex');
            }

            if (currentBuzzTriggerMode === 'on_zero') {
                isLocked = true;
                if (timerLabel) timerLabel.innerText = "WAITING FOR GO!";
                updatePlayerButtonUI(false, "LOCKED (WAIT FOR GO)");
            } else {
                isLocked = false;
                if (timerLabel) timerLabel.innerText = "TIMER";
                updatePlayerButtonUI(true);
            }

            if (timerVal) timerVal.innerText = timeLeft.toString().padStart(2, '0');
            playSound('tick');

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timerVal) timerVal.innerText = timeLeft.toString().padStart(2, '0');

                if (timeLeft > 0) {
                    playSound('tick');
                } else {
                    stopTimer();

                    if (currentBuzzTriggerMode === 'on_zero') {
                        playSound('go');
                        isLocked = false;
                        hasBuzzed = false;
                        if (timerLabel) timerLabel.innerText = "GO!";
                        if (timerVal) timerVal.innerText = "GO!";
                        updatePlayerButtonUI(true, "PRESS NOW!");
                    } else {
                        playSound('timeout');
                        isLocked = true;
                        stopSpeaking();
                        updatePlayerButtonUI(false, "TIME OUT");
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            const timerBox = document.getElementById('display-timer-box');
            if (timerBox) {
                timerBox.classList.add('hidden');
                timerBox.classList.remove('flex');
            }
        }

        // MQTT Engine
        function initMQTT(callback) {
            const statusEl = document.getElementById('connection-status');
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
                clientId: 'pb_' + Math.random().toString(16).substring(2, 10),
                keepalive: 30, reconnectPeriod: 2000
            });

            mqttClient.on('connect', () => {
                statusEl.className = "text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-900/80 text-emerald-400 border border-slate-800 flex items-center gap-2";
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span> ONLINE`;
                if (callback) callback();
            });

            mqttClient.on('reconnect', () => {
                statusEl.className = "text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-900/80 text-amber-400 border border-slate-800 flex items-center gap-2";
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span> CONNECTING`;
            });

            mqttClient.on('message', (topic, message) => {
                try {
                    const payload = JSON.parse(message.toString());
                    handleIncomingMessage(topic, payload);
                } catch(e) {}
            });
        }

                ruleText = mode === 'trivia' ? "กติกา: อ่านโจทย์จบจับเวลา" : "กติกา: กดได้ตลอดเวลา";
                actionsHTML = `
                    <button onclick="playSelectedPreset()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-400 border border-amber-500/30 font-black py-3 rounded-xl text-xs transition active:scale-95 shadow">

        function getCurrentModePresets() {
            const mode = document.getElementById('select-game-mode').value;
            return gamePresets[mode] || [];
        }

        function renderPresetDropdown() {
            const select = document.getElementById('select-preset-song');
            if (!select) return;

            const list = getCurrentModePresets();
            select.innerHTML = list.map((item, idx) => `
                <option value="${idx}">${item.title} (${item.artist})</option>
            `).join('');

            if (list.length > 0) onSelectPresetChange();
        }

        function onSelectPresetChange() {
            const idx = document.getElementById('select-preset-song').value;
            const list = getCurrentModePresets();
            const item = list[idx];
            if (item) {
                document.getElementById('input-host-lyrics').value = item.lyrics;
                currentSongInfo = item;
            }
        }

        function toggleCustomLyricsArea() {
            const container = document.getElementById('custom-lyrics-container');
            container.classList.toggle('hidden');
        }

        function startLineByLinePlayback(lyricsText, mode, triggerMode) {
            stopSpeaking();
            stopTimer();
            lyricLines = lyricsText.split('
').map(l => l.trim()).filter(Boolean);
            if (lyricLines.length === 0) lyricLines = [lyricsText];
            currentLineIndex = 0;
            currentTimerMode = mode || 'after';
            currentTimerSec = 10;
            currentBuzzTriggerMode = triggerMode || 'during';
            playCurrentLine();
        }

        function playCurrentLine() {
            if (currentLineIndex >= lyricLines.length) return;

            stopTimer();
            const text = lyricLines[currentLineIndex];

            document.getElementById('display-question-text').innerText = text;
            const playerQBox = document.getElementById('player-question-box');
            if (playerQBox) playerQBox.innerText = text;

            if (currentTimerMode === 'during' && !hasBuzzed) {
                startCountdown(currentTimerSec, currentBuzzTriggerMode);
            }

            speakThaiLine(text, () => {
                if (currentTimerMode === 'after' && !hasBuzzed) {
                    startCountdown(currentTimerSec, currentBuzzTriggerMode);
                }
            });
        }

            buzzList = [];

            stopSpeaking();

            publishControl({ action: 'reset' });

        function toggleLock() {

        function playSelectedPreset(forceTriggerMode) {
            const list = getCurrentModePresets();
            const idx = document.getElementById('select-preset-song').value;
            const item = list[idx];
            if (!item) return;
            currentSongInfo = item;
            buzzList = [];
            disqualifiedPlayers.clear();
            hideWinnerSpotlight();
            
            const mode = document.getElementById('select-game-mode').value;
            const trigger = forceTriggerMode || (mode === 'speed_go' ? 'on_zero' : 'during');
            
            publishControl({ action: 'reset' });
            publishControl({ 
                action: 'read_lyrics_linebyline', 
                lyrics: item.lyrics, mode: 'after', triggerMode: trigger, gameModeName: mode.toUpperCase() 
            });
        }

            const list = getCurrentModePresets();
            if(list.length === 0) return;

            onSelectPresetChange();

            currentSongInfo = { title: 'โจทย์กำหนดเอง', artist: 'Host' };
            buzzList = [];
            disqualifiedPlayers.clear();
            hideWinnerSpotlight();
            
            publishControl({ action: 'reset' });
            publishControl({ 
                action: 'read_lyrics_linebyline', 
                lyrics: lyrics, mode: 'after', triggerMode: 'during', gameModeName: 'CUSTOM' 
            });
        }

        function addNewItemToPreset() {
            const lyrics = document.getElementById('input-host-lyrics').value.trim();
            if(!lyrics) return;
            const title = prompt('ชื่อโจทย์/หัวข้อ:') || 'ข้อใหม่';
            const artist = prompt('เฉลย/คำอธิบาย:') || 'ไม่ระบุ';

            const mode = document.getElementById('select-game-mode').value;
            if(!gamePresets[mode]) gamePresets[mode] = [];
            gamePresets[mode].push({ title, artist, lyrics });

            renderPresetDropdown();
            document.getElementById('select-preset-song').value = gamePresets[mode].length - 1;
            onSelectPresetChange();
        }

        // JUDGING LOGIC (CORRECT / WRONG)
        function judgeAnswer(isCorrect) {
            if (buzzList.length === 0) return;

            const currentWinner = buzzList[0].name;

            if (isCorrect) {
                // Award points
                playerScores[currentWinner] = (playerScores[currentWinner] || 0) + 1;
                publishControl({ action: 'scores', scores: playerScores });
                publishControl({ 
                    action: 'reveal_answer', 
                    song: currentSongInfo || { title: 'เฉลย', artist: '' } 
                });
                try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } }); } catch(e){}
            } else {
                // Wrong answer / penalty (-1 pt optional)
                playerScores[currentWinner] = Math.max(0, (playerScores[currentWinner] || 0) - 1);
                publishControl({ action: 'scores', scores: playerScores });

                // Pass to next person in queue or unlock buzzer for remaining eligible players
                publishControl({ action: 'answer_wrong', wrongPlayer: currentWinner });
            }
        }

        function songNextLine() {
            publishControl({ action: 'next_line' });
        }

        function startTimerConfigured(seconds) {
            buzzList = [];
            disqualifiedPlayers.clear();
            hideWinnerSpotlight();
            publishControl({ action: 'reset' });
            publishControl({ action: 'timer', duration: seconds, triggerMode: 'during' });
        }

        function addScore(name, pts) {
            playerScores[name] = Math.max(0, (playerScores[name] || 0) + pts);
            renderHostScoreboard();
            publishControl({ action: 'scores', scores: playerScores });
        }

        function clearRoomCompletely() {
            if (confirm('ล้างข้อมูลห้องทั้งหมดหรือไม่?')) {
                buzzList = []; playerScores = {}; disqualifiedPlayers.clear();
                stopSpeaking(); stopTimer();
                renderHostScoreboard();
                publishControl({ action: 'clear' });
            }
        }

        function publishControl(data) {
            if (mqttClient && currentRoom) {
                mqttClient.publish(`partybuzz/${currentRoom}/control`, JSON.stringify(data));
            }
        }

        function hideWinnerSpotlight() {
            const spotlight = document.getElementById('display-winner-spotlight');
            if (spotlight) spotlight.classList.add('hidden');
        }

        function renderHostScoreboard() {
            const el = document.getElementById('host-scoreboard');
            const entries = Object.entries(playerScores);
            if (entries.length === 0) {
                el.innerHTML = `<p class="text-xs text-slate-600 text-center py-2">ยังไม่มีผู้เล่น</p>`;
                return;
            }
            el.innerHTML = entries.map(([name, score]) => `
                <div class="flex justify-between items-center bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800 text-xs">
                    <span class="font-bold text-slate-300">${name}</span>
                    <div class="flex items-center gap-1">
                        <span class="font-bold text-amber-400 font-mono mr-2">${score}</span>
                        <button onclick="addScore('${name}', 1)" class="bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded text-emerald-400 font-bold text-[10px]">+1</button>
                        <button onclick="addScore('${name}', -1)" class="bg-slate-800 hover:bg-slate-700 px-2 py-0.5 rounded text-rose-400 font-bold text-[10px]">-1</button>
                    </div>
                </div>
            `).join('');
        }

        // PLAYER LOGIC
        function showPlayerLogin() { 
            const savedName = localStorage.getItem('pb_name');
            const savedRoom = localStorage.getItem('pb_room');
            if (savedName) document.getElementById('input-player-name').value = savedName;
            if (savedRoom) document.getElementById('input-room-code').value = savedRoom;
            showView('view-player-login'); 
        }

        function joinRoom() {
            const name = document.getElementById('input-player-name').value.trim();
            const room = document.getElementById('input-room-code').value.trim();
            if (!name || !room) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            myPlayerName = name; currentRoom = room;
            localStorage.setItem('pb_name', name);
            localStorage.setItem('pb_room', room);

            document.getElementById('player-display-name').innerText = myPlayerName;
            showView('view-player-game');

            initMQTT(() => {
                mqttClient.subscribe(`partybuzz/${currentRoom}/control`);
            });
        }

        function pressBuzz() {
            if (hasBuzzed || isLocked || disqualifiedPlayers.has(myPlayerName)) return;
            hasBuzzed = true;
            playSound('buzz');
            updatePlayerButtonUI(false, "BUZZED!");

            const now = new Date();
            const timeStr = `${now.getMinutes()}:${now.getSeconds()}.${Math.floor(now.getMilliseconds()/10).toString().padStart(2, '0')}`;
            
            mqttClient.publish(`partybuzz/${currentRoom}/buzz`, JSON.stringify({
                name: myPlayerName, timeStr: timeStr, timestamp: Date.now()
            }));
        }

        function updatePlayerButtonUI(unlocked, text) {
            const btn = document.getElementById('buzz-button');
            const banner = document.getElementById('player-status-banner');
            if (!btn || !banner) return;

            if (disqualifiedPlayers.has(myPlayerName)) {
                btn.className = "w-56 h-56 rounded-full bg-slate-900 border-8 border-slate-950 flex flex-col items-center justify-center cursor-not-allowed opacity-30 my-2";
                banner.className = "w-full py-2 px-4 rounded-xl bg-slate-950 border border-slate-800 text-rose-500 text-xs font-bold mb-4";
                banner.innerText = "ตอบผิดแล้ว (DISQUALIFIED THIS ROUND)";
                return;
            }

            if (unlocked) {
                btn.className = "buzz-btn-active w-56 h-56 rounded-full bg-gradient-to-b from-rose-500 to-rose-700 border-8 border-slate-950 shadow-2xl flex flex-col items-center justify-center cursor-pointer transition transform my-2 pulse-fast";
                banner.className = "w-full py-2 px-4 rounded-xl bg-slate-950 border border-slate-800 text-emerald-400 text-xs font-bold mb-4";
                banner.innerText = "READY TO BUZZ";
            } else {
                btn.className = "w-56 h-56 rounded-full bg-slate-900 border-8 border-slate-950 flex flex-col items-center justify-center cursor-not-allowed opacity-30 my-2";
                banner.className = "w-full py-2 px-4 rounded-xl bg-slate-950 border border-slate-800 text-rose-500 text-xs font-bold mb-4";
                banner.innerText = text || "LOCKED";
            }
        }

        // REALTIME MQTT HANDLER
        function handleIncomingMessage(topic, payload) {
            if (topic.endsWith('/buzz')) {
                const exists = buzzList.some(i => i.name === payload.name);
                if (!exists && !isLocked && !disqualifiedPlayers.has(payload.name)) {
                    buzzList.push(payload);
                    // Sort queue strictly by client timestamp for fairness
                    buzzList.sort((a,b) => a.timestamp - b.timestamp);

                    if (!(payload.name in playerScores)) playerScores[payload.name] = 0;
                    renderTVBuzzList();
                    renderHostScoreboard();
                    playSound(buzzList.length === 1 ? 'correct' : 'buzz');

                    if (buzzList.length === 1) {
                        const spotlight = document.getElementById('display-winner-spotlight');
                        const winnerName = document.getElementById('display-winner-name');
                        if (spotlight && winnerName) {
                            winnerName.innerText = payload.name;
                            spotlight.classList.remove('hidden');
                        }
                    }

                    stopSpeaking();
                    stopTimer();
                }
            }

            if (topic.endsWith('/control')) {
                if (payload.action === 'reset') {
                    buzzList = []; hasBuzzed = false; isLocked = false; disqualifiedPlayers.clear();
                    stopSpeaking(); stopTimer(); hideWinnerSpotlight();
                    renderTVBuzzList();
                    updatePlayerButtonUI(true);
                } else if (payload.action === 'lock') {
                    isLocked = true;
                    stopSpeaking(); stopTimer();
                    updatePlayerButtonUI(false, "LOCKED");
                } else if (payload.action === 'unlock') {
                    isLocked = false;
                    if (!disqualifiedPlayers.has(myPlayerName)) hasBuzzed = false;
                    updatePlayerButtonUI(true);
                } else if (payload.action === 'timer') {
                    buzzList = []; hasBuzzed = false; disqualifiedPlayers.clear(); hideWinnerSpotlight();
                    stopSpeaking();
                    startCountdown(payload.duration, payload.triggerMode);
                } else if (payload.action === 'read_lyrics_linebyline') {
                    hasBuzzed = false; disqualifiedPlayers.clear(); hideWinnerSpotlight();
                    const badge = document.getElementById('display-mode-badge');
                    if (badge && payload.gameModeName) badge.innerText = payload.gameModeName;
                    startLineByLinePlayback(payload.lyrics, payload.mode, payload.triggerMode);
                } else if (payload.action === 'next_line') {
                    hasBuzzed = false;
                    currentLineIndex++;
                    if (currentLineIndex < lyricLines.length) {
                        playCurrentLine();
                    } else {
                        stopTimer();
                        document.getElementById('display-question-text').innerText = "END OF QUESTION";
                    }
                } else if (payload.action === 'answer_wrong') {
                    playSound('wrong');
                    const wrongPlayer = payload.wrongPlayer;
                    disqualifiedPlayers.add(wrongPlayer);
                    
                    // Remove wrong player from current queue
                    buzzList = buzzList.filter(item => item.name !== wrongPlayer);
                    renderTVBuzzList();

                    if (buzzList.length > 0) {
                        // Advance spotlight to next player in queue
                        const spotlight = document.getElementById('display-winner-spotlight');
                        const winnerName = document.getElementById('display-winner-name');
                        if (spotlight && winnerName) {
                            winnerName.innerText = buzzList[0].name;
                            spotlight.classList.remove('hidden');
                        }
                    } else {
                        // Queue empty, automatically unlock buzzer for remaining players who haven't buzzed/been disqualified
                        hideWinnerSpotlight();
                        isLocked = false;
                        if (!disqualifiedPlayers.has(myPlayerName)) {
                            hasBuzzed = false;
                            updatePlayerButtonUI(true, "TRY AGAIN!");
                        }
                    }
                } else if (payload.action === 'reveal_answer') {
                    stopSpeaking(); stopTimer();
                    playSound('correct');
                    document.getElementById('display-question-text').innerHTML = `
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-widest block mb-1">ANSWER</span>
                        <span class="text-amber-400 text-3xl sm:text-5xl font-black tracking-wide">${payload.song.title}</span>
                        <span class="text-base text-slate-400 block mt-1">${payload.song.artist}</span>
                    `;
                    const pQBox = document.getElementById('player-question-box');
                    if (pQBox) pQBox.innerText = `${payload.song.title} - ${payload.song.artist}`;
                } else if (payload.action === 'scores' && payload.scores) {
                    playerScores = payload.scores;
                    renderTVScoreboard();
                    const myScore = playerScores[myPlayerName] || 0;
                    const pScoreEl = document.getElementById('player-display-score');
                    if (pScoreEl) pScoreEl.innerText = `${myScore} PTS`;
                } else if (payload.action === 'clear') {
                    localStorage.removeItem('pb_name');
                    localStorage.removeItem('pb_room');
                    stopSpeaking(); stopTimer();
                    location.reload();
                }
            }
        }

        function renderTVBuzzList() {
            const listEl = document.getElementById('display-buzz-list');
            const queueCount = document.getElementById('tv-queue-count');
            if (queueCount) queueCount.innerText = `${buzzList.length} IN QUEUE`;
            if (!listEl) return;

            if (buzzList.length === 0) {
                listEl.innerHTML = `<div class="text-center py-8 text-slate-700 text-xs border border-dashed border-slate-800/80 rounded-2xl">WAITING FOR BUZZ...</div>`;
                return;
            }

            listEl.innerHTML = buzzList.map((item, index) => {
                const isFirst = index === 0;
                return `
                    <div class="flex items-center justify-between p-3 sm:p-4 rounded-2xl ${isFirst ? 'bg-amber-500/10 border border-amber-500/50 text-amber-300 glow-amber' : 'bg-slate-950 border border-slate-800 text-slate-300'} transition-all">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-xl flex items-center justify-center font-black text-sm ${isFirst ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-500'}">
                                ${index + 1}
                            </span>
                            <span class="font-bold text-base sm:text-lg">${item.name}</span>
                        </div>
                        <span class="text-xs font-mono text-slate-500 bg-slate-900 px-3 py-1 rounded-lg border border-slate-800">${item.timeStr}</span>
                    </div>
                `;
            }).join('');
        }

        function renderTVScoreboard() {
            const el = document.getElementById('display-scoreboard');
            if (!el) return;
            const entries = Object.entries(playerScores).sort((a,b) => b[1] - a[1]);
            if (entries.length === 0) {
                el.innerHTML = `<p class="text-xs text-slate-700 text-center py-6">NO SCORES YET</p>`;
                return;
            }
            el.innerHTML = entries.map(([name, score], idx) => `
                <div class="flex justify-between items-center bg-slate-900/90 p-2.5 rounded-xl border border-slate-800/80">
                    <span class="font-medium text-slate-300 text-xs">#${idx+1} ${name}</span>
                    <span class="font-black text-amber-400 font-mono text-xs">${score}</span>
                </div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');

            if (roomParam) {
                document.getElementById('input-room-code').value = roomParam;
                showPlayerLogin();
            }
        });
    </script>
</body>
</html>
